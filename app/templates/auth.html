<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - Laptop Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="bg-slate-900 px-4 py-5 text-white">
      <div class="mx-auto max-w-5xl">
        {% include "partials/navbar.html" %}
      </div>
    </header>
    <main class="mx-auto max-w-md px-4 py-10">
      <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <h1 class="text-2xl font-bold">{{ title }}</h1>
        {% if error %}
          <p role="alert" class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
        {% endif %}

        <form method="post" action="/{{ mode }}" class="mt-6 space-y-4">
          {% if mode == "register" %}
            <label class="block text-sm font-medium">
              Họ và tên
              <input type="text" name="full_name" value="{{ full_name or '' }}" required autocomplete="name" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
          {% endif %}
          <label class="block text-sm font-medium">
            Email
            <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
          </label>
          <label class="block text-sm font-medium">
            Mật khẩu
            <input type="password" name="password" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">
          </label>
          <button type="submit" class="w-full rounded-lg bg-blue-700 px-4 py-3 font-semibold text-white hover:bg-blue-800">
            {{ "Tạo tài khoản" if mode == "register" else "Đăng nhập" }}
          </button>
        </form>

        <p class="mt-5 text-sm text-slate-600">
          {% if mode == "register" %}
            Đã có tài khoản? <a href="/login" class="font-semibold text-blue-700">Đăng nhập</a>
          {% else %}
            Chưa có tài khoản? <a href="/register" class="font-semibold text-blue-700">Đăng ký</a>
          {% endif %}
        </p>
      </section>
    </main>
  </body>
</html>
