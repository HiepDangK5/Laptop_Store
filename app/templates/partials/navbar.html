<nav class="flex flex-wrap items-center justify-between gap-3">
  <a href="/" class="text-xl font-bold text-white">Laptop Store</a>
  <div class="flex items-center gap-4 text-sm">
    {% if current_user %}
      <span class="text-slate-200">Xin chào, {{ current_user.full_name }}</span>
      <form method="post" action="/logout">
        <button type="submit" class="rounded-lg border border-slate-500 px-3 py-2 text-white hover:bg-slate-800">Đăng xuất</button>
      </form>
    {% else %}
      <a href="/login" class="text-slate-200 hover:text-white">Đăng nhập</a>
      <a href="/register" class="rounded-lg bg-blue-600 px-3 py-2 font-semibold text-white hover:bg-blue-500">Đăng ký</a>
    {% endif %}
  </div>
</nav>
